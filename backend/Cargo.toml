[package]
name = "icecube"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sofyan48/ICEcube"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
futures = "0.3"
jiff = "0.2"
k8s-openapi = { version = "0.29", features = ["latest"] }
kube = { version = "5.1", features = ["derive", "runtime"] }
rcgen = "0.14.10"
rust-embed = { version = "8.14", features = ["mime-guess"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1"
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
