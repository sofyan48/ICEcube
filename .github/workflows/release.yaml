# Push a tag like v0.1.0 to publish:
#   - image  ghcr.io/sofyan48/icecube:0.1.0 (linux/amd64 + linux/arm64)
#   - chart  oci://ghcr.io/sofyan48/charts/icecube --version 0.1.0
# Chart version and appVersion are set from the tag, so Chart.yaml does not
# need a manual bump.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/icecube
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/icecube --version "$version" --app-version "$version" -d dist
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/icecube-*.tgz "$CHART_REPO"
      # Works whether or not the release already exists: it may have been
      # created on github.com (which also pushes the tag and starts this
      # workflow), or by an earlier run of this job being re-run.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; uploading the chart to it."
            gh release upload "$GITHUB_REF_NAME" dist/icecube-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/icecube-*.tgz --generate-notes --verify-tag
          fi
