apiVersion: v1
kind: Pod
metadata:
  name: {{ include "icecube.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: check
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      env:
        - name: USER
          valueFrom: { secretKeyRef: { name: {{ include "icecube.secretName" . }}, key: {{ .Values.auth.usernameKey }} } }
        - name: PASS
          valueFrom: { secretKeyRef: { name: {{ include "icecube.secretName" . }}, key: {{ .Values.auth.passwordKey }} } }
      # Health, then an authenticated API call that also proves Kubernetes access.
      command: [sh, -ec]
      args:
        - |
          base=http://{{ include "icecube.fullname" . }}:{{ .Values.service.port }}
          curl -fsS "$base/healthz"
          curl -fsS -u "$USER:$PASS" "$base/api/groups"
