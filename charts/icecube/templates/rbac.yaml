{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "icecube.fullname" . }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
rules:
  {{- if .Values.crds.manageOnStartup }}
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, create, patch]
  {{- end }}
  - apiGroups: [icecube.io]
    resources: [icecubeusers, icecubegroups]
    verbs: [get, list, watch, create, update, patch, delete]
  # Certificate history lives in the user's status.
  - apiGroups: [icecube.io]
    resources: [icecubeusers/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  # Templates are ClusterRoles. `escalate` lets ICEcube create roles with
  # permissions it does not hold itself; `bind` lets it grant them.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # Issue client certificates.
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests]
    verbs: [get, list, create, delete]
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests/approval]
    verbs: [update, patch]
  - apiGroups: [certificates.k8s.io]
    resources: [signers]
    resourceNames: [kubernetes.io/kube-apiserver-client]
    verbs: [approve]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "icecube.fullname" . }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "icecube.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "icecube.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
