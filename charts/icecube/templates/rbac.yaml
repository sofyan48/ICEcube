{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "icecube.fullname" . }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
rules:
  {{- if .Values.crds.manageOnStartup }}
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, create, patch]
  {{- end }}
  - apiGroups: [icecube.io]
    resources: [icecubeusers, icecubegroups]
    verbs: [get, list, watch, create, update, patch, delete]
  # Certificate history lives in the user's status.
  - apiGroups: [icecube.io]
    resources: [icecubeusers/status]
    verbs: [get, update, patch]
  # The controller watches namespaces so bindings appear once their namespace exists.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  # Templates are ClusterRoles. `escalate` lets ICEcube create roles with
  # permissions it does not hold itself; `bind` lets it grant them.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # Issue client certificates.
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests]
    verbs: [get, list, create, delete]
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests/approval]
    verbs: [update, patch]
  - apiGroups: [certificates.k8s.io]
    resources: [signers]
    resourceNames: [kubernetes.io/kube-apiserver-client]
    verbs: [approve]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "icecube.fullname" . }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "icecube.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "icecube.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Objects ICEcube keeps in its own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "icecube.fullname" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
rules:
  {{- if .Values.storeKubeconfigs }}
  # Stored kubeconfigs.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, update, delete]
  {{- end }}
  # ServiceAccounts of token-based users, and their tokens.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
  # Deleted usernames blocked until their certificates expire.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, update]
  # Leader election.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "icecube.fullname" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "icecube.fullname" . }}-local
subjects:
  - kind: ServiceAccount
    name: {{ include "icecube.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
