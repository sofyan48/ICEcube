{{- if not .Values.auth.existingSecret }}
{{- $name := include "icecube.secretName" . }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- /* Reuse the generated password on upgrade instead of rotating it. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data .Values.auth.passwordKey) }}
{{- $password = index $existing.data .Values.auth.passwordKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icecube.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.usernameKey }}: {{ .Values.auth.username | b64enc | quote }}
  {{ .Values.auth.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
